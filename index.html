<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express API</title>
</head>

<body>
    <script>
        function searchValue(val, arr) {
            if (arr.includes((val))) {
                return arr.findIndex((arrVal) => val === arrVal)
            } else {
                return -1
            }
        }

        searchValue(1, [1, 2, 4])



    </script>
</body>

</html>
